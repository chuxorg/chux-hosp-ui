name: UI validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-validation:
    name: bootstrap-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ./scripts/validate.sh
